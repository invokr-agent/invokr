version: "2"

linters:
  enable:
    - gocyclo
    - gocognit
    - funlen
    - nestif
    - dupl
    - goclocbudget

  settings:
    gocyclo:
      min-complexity: 12

    gocognit:
      min-complexity: 15

    funlen:
      lines: 80
      statements: 50
      ignore-comments: true

    nestif:
      min-complexity: 5

    dupl:
      threshold: 100

    custom:
      goclocbudget:
        type: "module"
        description: "Enforces the implementation Go LOC budget using gocloc."
        settings:
          # Repo-wide ceiling. Raised 30330→35000 on 2026-08-25 on the evidence in
          # docs/private/reviews/2026-08-25-loc-vs-peer-harnesses.md: measured against seven
          # comparable harnesses, invokr is the second-smallest in its class with the
          # broadest feature set, and crush — same language, same TUI framework — runs
          # 2.2x larger with fewer features. The cap exists to catch runaway growth,
          # not to hold the project below its own class.
          #
          # Per-area budgets live in budget_test.go and bind underneath this number;
          # this one stays the hard aggregate limit. Revisit at 40000 rather than in
          # 150-line increments, and read the review before raising it again.
          # 35000→35100 on 2026-09-06: the /reasoning enable_thinking path landed
          # with the repo sitting exactly on the cap; smallest bump that fits it.
          # 35222→35226 2026-09-07: exec --json ledger ts/model stamping
          # 35226→35232 2026-09-07: repeat-exhaustion summary wrap-up
          # 2026-09-18: user approved +100 for #577; prune again on dev.
          # 2026-10-08: baseline 35892 after runtime trim; cap has no spare lines.
          # 2026-10-11 +73: custom lint counts 35965 with pinned Git binds and
          # descriptor closure (#577 F1); the per-area reporter uses a different count.
          # 2026-10-12 +81: #665 on-demand overlay and retained event details;
          # exact fresh-cache count, no per-area cap change.
          # 2026-10-12 +209: interactive /tools dialog on rebased dev;
          # exact custom-lint count, no per-area cap change.
          # 2026-10-12 +32: /tools status colors and Native/Custom tools tabs.
          # 2026-10-12 +19: put /tools tabs on the outer panel border.
          # 2026-10-16: reconcile merged per-model options and JSON profiles (#709, #708).
          max-go-code-lines: 37683  # 37494→37683 2026-10-20: smallest ceiling that fits — gocloc reports 37683 impl lines (was ~119 over at 37494 before the new provider added its ~70). 37488→37494 2026-10-19: reroute folds echo-separated cat &&/; chains into one read (net of a trim pass). 37437→37488 2026-10-19: shell approval details show the script a line runs (skips one this line writes; host route too). 37245→37437 2026-10-19: shell lines a native tool covers reroute to it (read, file_search, git_read, edit) with a call-it-directly note. 37101→37245 2026-10-19: git_write push via host git behind publishing approval; shell git push redirect. 37096→37101 2026-10-19: CodeQL unsafe-quoting fix (marshalled tool-result envelope). 36962→37096 2026-10-19: approval-gated reads outside the workspace (/reads, read + file_search dir, setup + ctrl+o). 36853→36962 2026-10-18: image paste (path drop + ctrl+v clipboard) sent to vision models. 36692→36853 2026-10-18: /tools Install tab (hub list/install in tools/system/toolbox) + live catalog reload after install. 36602→36692 2026-10-17: `invokr toolbox install` + install from the tools dialog (#711). 36600→36602 2026-10-17: toolbox ask_once/always_ask approval policies (#710). 35808→35812 2026-10-07: tools errors show the run shape. 35797→35808 2026-10-07: prompt names optional tools (schedule/delegate_task 0 calls in 36 baseline runs). 35849→35797 2026-10-06: remove disabled reasoning continuation and stale retry state; 35841→35849 2026-10-06: act-on-cut no-plan nudge (#653 review). 35702→35841 2026-10-04: V5 managed tools + act-on-cut (A-V), bench winner on output/turns. 35670→35702 2026-10-03: CLI onboarding fixes (doctor empty model, setup non-TTY, readable config durations, index/setup hints); trimmed first. 35623→35670 2026-10-03: CLI surface (#651) — sync model resolution, shared --json, job-policy codec, --last, sessions rm, provider list, index status, version, profile resolution; net of trims. 35617→35623 2026-09-27: merge with #611's tip99 bench defaults bump (needed 35599, base already at 35617 post #625). 35593→35617 2026-09-27: log a turn's full reasoning text on the events bus (#577) — dev baseline was already 3 over. 35536→35593 2026-09-25: CI baseline was 12 over; trimmed #577 tool-result budget policy adds the remaining lines.  35523→35536 2026-09-22: approval resolves every path of a batched read (#577 bench). 35514→35523 2026-09-22: paths-only read + approval sees every batched path (#577 bench). 35495→35514 2026-09-21: shell returns plain text (#577 bench). 35374→35495 2026-09-21: #577 bench three rebased on dev 690e45c (block anchor, reserve compaction, multi-file read). 35155→35374 2026-09-19: TUI settings panel (4 tabs, huh forms, config patch) on merged #595 dev; −6 safe trims first (gitDirs, gradle registry inline, one-arm switch). 35100→35155 2026-09-19: user-approved #595 review fixes on merged dev; prune later. 32810→35000 2026-09-09: repo-wide ceiling restored to the documented 35,000 cap; per-feature bumps are no longer the mechanism — keep diffs minimal and trim after tests instead; 32795→32810 2026-09-09: per-row input caret (wrap-aware cursor display row); 32814→32795 2026-09-08: turn budget trim (window slice → three turn indices, quota defaults via maps.Copy, JSON tool-quota env branch dropped), no behaviour change; 32759→32814 2026-09-08: LOC cap after stacking turn budget (actual post-rebase count); 32611→32759 2026-09-08: dynamic turn budget (weighted turns, progress extension, tool quotas, exec --max-turns); 32546→32611 2026-09-08: batched tool-result aging (age threshold, size floor, restorable stubs, write/newest-per-tool protection); 32586→32546 2026-09-08: batch-10 LOC trim (stdlib brace expansion, no behaviour change); 32541→32586 2026-09-08: brace expansion admits in-workspace absolute paths (r11 W1/1); 32469→32541 2026-09-08: batch-10 harness fixes (searxng fallback, root-rebased abs path, brace expansion, tolerant edit_file); 32499→32469 2026-09-08: batch-9 LOC trim (no behaviour change); 32443→32499 2026-09-08: batch-9 harness fixes (template-markup arg guard, PYTHONPATH prefix, scratch-dir hint); 32300→32443 2026-09-08: batch-8 harness fixes + deferred tool schemas (#480) + tool-result aging; 33950→32300 2026-09-08: third LOC pass (structural collapses + literal packing), no behaviour change; 35310→33950 2026-09-07: LOC pass on the dev→main promotion diff (shared helpers, stdlib slices/cmp, dropped forwarders), no behaviour change; 35480→35521 2026-09-07: approval-queue UX (#479) — derived grant pattern + pipeline-aware subject rendering; 35800→35480 2026-09-07: LOC pass (dedupe + stdlib slices/maps/cmp), no behaviour change; 35540→35660 2026-09-07: explicit model override + ledger served_model + proactive compaction; 35660→35690 searxng throttle retry
          # 35690→35800 2026-09-07: round-8 harness fixes (shared /tmp out of the workspace, step-limit stop reason + banner, build-tool env prefixes) plus the peer's context budget/retention/compaction pass
          # 35460→35540 2026-09-07: resumable interrupted exec sessions (interrupt persistence, --last preference + reporting, shared transcript attach)
          include-tests: false
          exclude-generated: true
          exclude-dirs:
            - vendor
            - .git
            - node_modules
            - app/dist
            - support/testutil # test-support code; include-tests: false intent
            - cmd/e2ereport # e2e reporting harness, not shipped implementation
            - bench # benchmark harness + vendored tasks, not shipped implementation
            - .claude # stale agent worktrees with full repo copies

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
          - nestif
          - dupl
