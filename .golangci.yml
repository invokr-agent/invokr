version: "2"

linters:
  enable:
    - gocyclo
    - gocognit
    - funlen
    - nestif
    - dupl
    - goclocbudget

  settings:
    gocyclo:
      min-complexity: 12

    gocognit:
      min-complexity: 15

    funlen:
      lines: 80
      statements: 50
      ignore-comments: true

    nestif:
      min-complexity: 5

    dupl:
      threshold: 100

    custom:
      goclocbudget:
        type: "module"
        description: "Enforces the implementation Go LOC budget using gocloc."
        settings:
          # Repo-wide ceiling: the hard aggregate limit, enforced by gocloc. The per-area
          # budgets in budget_test.go bind underneath this number.
          #
          # The cap exists to catch runaway growth, not to freeze the current line count.
          # Before raising it, lower it: trim implementation lines and set the cap to the
          # exact measured count. Raise only when the count forces it, and only to that
          # count — never above it. Change history: git log -p .golangci.yml
          max-go-code-lines: 38461  # 2026-10-22 +8 to the measured count: the /usage panel clamps an over-estimate of reasoning to the provider's completion counts, indexes its eighth blocks by rune and drops the duplicated esc hint; exact measured count. 2026-10-22 to the measured count: the /usage panel (layout D), its group/row renderers and the reasoning totals; exact measured count. 37913  # 2026-10-22 +80: sandboxed gh calls are denied with a pointer to the github_pr toolbox tool, and the TUI offers its install once per session; exact measured count. 2026-10-22 +41: stringified tool arguments (whole object or one named field) unwrap in the shared decoder, and a cancelled process group reports a completed cancel; exact measured count. 2026-10-22 +58: the footer names the model the backend served and fills a blank ctx limit from the model list; exact measured count. 2026-10-22 -50: the /mouse, /notify and /syntax slash commands and the syntax picker they fed drop out (the settings View tab keeps their setters); exact measured count. 2026-10-22 +3: overlay bodies drop the section rule that repeated their title, net of the plain-renderer helper and the split grants row; exact measured count. 2026-10-22 +94: invokr update downloads and verifies the release in Go instead of running install.sh. 2026-10-21 -20: the installer embeds install.sh again rather than fetching it at runtime; exact measured count. 2026-10-21 +91: upgrade command plus its bundled installer land (cmd/upgrade_cli.go, internal/installer); 2026-10-21 +1: the semver compare restores the v prefix goreleaser drops; 2026-10-20 raised to the measured count after the update checker landed
          include-tests: false
          exclude-generated: true
          exclude-dirs:
            - vendor
            - .git
            - node_modules
            - app/dist
            - support/testutil # test-support code; include-tests: false intent
            - cmd/e2ereport # e2e reporting harness, not shipped implementation
            - bench # benchmark harness + vendored tasks, not shipped implementation
            - .claude # stale agent worktrees with full repo copies

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
          - nestif
          - dupl
