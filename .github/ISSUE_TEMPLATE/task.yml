name: Task
description: A change to make, with the criteria that close it
body:
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: What is wrong or missing today, and where (files, commands, platforms).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions that close the issue.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Limits, risks, links. Optional.
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers this waits on. Optional.
