name: sandbox-containment

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

jobs:
  sandbox-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
      # Ubuntu 24.04 runners block unprivileged user namespaces via AppArmor.
      # No fallback: an incapable runner must fail this required lane.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sudo apt-get update && sudo apt-get install -y python3-venv util-linux procps curl iproute2
      - run: go mod download
      - run: make containment
