name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - run: make lint-ci

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - run: go mod download
      - run: make test
        env:
          INVOKR_TOOLBOX_ALLOW_UNSANDBOXED: "1"

  shared-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s toolbox/browser_agent -p 'test_*.py' -v
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - run: go test -race ./support/registry
