name: e2e

on:
  pull_request:
    branches: [main, dev]

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      INVOKR_TOOLBOX_ALLOW_UNSANDBOXED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y python3-venv tmux sqlite3 util-linux
      - run: go mod download
      - run: make e2e
