name: e2e

on:
  pull_request:
    branches: [main, dev]

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      INVOKR_TOOLBOX_ALLOW_UNSANDBOXED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y python3-venv tmux sqlite3 util-linux
      - run: go mod download
      - run: make e2e
