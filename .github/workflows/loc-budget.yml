name: loc-budget

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: loc-budget-${{ github.event.pull_request.number || github.ref }}

jobs:
  pr:
    if: github.event_name != 'push'
    permissions:
      contents: read
      pull-requests: write
    uses: antonikliment/go-code-metrics/.github/workflows/budget-pr.yml@64babae668a47b09395c745387248eee715cf7be # v0.2.0
    with:
      version: v0.2.0
      budgets-repo: invokr-agent/loc-budgets
    secrets:
      app-id: ${{ secrets.LINE_WARDEN_APP_ID }}
      app-key: ${{ secrets.LINE_WARDEN_APP_KEY }}
  main:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: antonikliment/go-code-metrics/.github/workflows/budget-main.yml@64babae668a47b09395c745387248eee715cf7be # v0.2.0
    with:
      version: v0.2.0
      dashboard-issue: false
      budgets-repo: invokr-agent/loc-budgets
    secrets:
      app-id: ${{ secrets.LINE_WARDEN_APP_ID }}
      app-key: ${{ secrets.LINE_WARDEN_APP_KEY }}
      token: ${{ secrets.LOC_BUDGET_TOKEN }}
