name: release

# Triggered by vX.Y.Z tags. goreleaser infers owner/repo from the git remote
# and publishes checksummed archives to GitHub Releases. The version comes from
# the tag alone, so no commit to main is required.
on:
  push:
    tags:
      - 'v*'

# Release job only; it raises to contents: write inside the job.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse tags not cut from main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || \
            { echo "tagged commit is not on main; cut the tag from main first"; exit 1; }
      - name: Refuse non-SemVer tags
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || { echo "expected vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install aarch64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      # Release notes are this tag's CHANGELOG.md section; the file itself is
      # restored so goreleaser sees a clean tree.
      - name: Changelog section
        run: |
          scripts/changelog.sh "$GITHUB_REF_NAME"
          awk -v t="## $GITHUB_REF_NAME " 'index($0,t)==1{f=1;next} f&&/^## /{exit} f' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          git checkout -- CHANGELOG.md
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
          distribution: goreleaser
          version: v2.18.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Tags are cut from main, so the new section lands there through a PR.
      - name: Open changelog PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -q origin/main
          scripts/changelog.sh "$GITHUB_REF_NAME"
          git diff --quiet && exit 0
          branch="changelog/$GITHUB_REF_NAME"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git commit -am "docs: changelog for $GITHUB_REF_NAME"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "docs: changelog for $GITHUB_REF_NAME" --body "Changes since the previous release, grouped by type."
