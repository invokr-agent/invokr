name: release

# Triggered by vX.Y.Z tags. goreleaser infers owner/repo from the git remote
# and publishes checksummed archives to GitHub Releases. The version comes from
# the tag alone, so no commit to main is required.
on:
  push:
    tags:
      - 'v*'

# Release job only; it raises to contents: write inside the job.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Refuse tags not cut from main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || \
            { echo "tagged commit is not on main; cut the tag from main first"; exit 1; }
      - name: Refuse non-SemVer tags
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || { echo "expected vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
      - name: Install aarch64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
          distribution: goreleaser
          version: v2.18.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
