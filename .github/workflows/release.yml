name: release

# Triggered by vX.Y.Z tags. goreleaser infers owner/repo from the git remote
# and publishes checksummed archives to GitHub Releases. The version comes from
# the tag alone, so no commit to main is required.
on:
  push:
    tags:
      - 'v*'
      - '!v*-edge.*' # edge builds are published by edge.yml

# Release job only; it raises to contents: write inside the job.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse tags not cut from main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || \
            { echo "tagged commit is not on main; cut the tag from main first"; exit 1; }
      - name: Refuse non-SemVer tags
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || { echo "expected vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install aarch64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      # The release notes are the tag's commits grouped by type; the GitHub
      # release is the changelog.
      - name: Release notes
        run: scripts/changelog.sh "$GITHUB_REF_NAME" >"$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
          distribution: goreleaser
          version: v2.18.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
