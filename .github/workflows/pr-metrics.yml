name: pr-metrics

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
      - run: go mod download
      - run: >
          go tool sizeanalyzer -pr -base "origin/${{ github.base_ref }}"
          -json pr-metrics.json -html pr-metrics.html | tee pr-metrics.txt
      - name: complexity-diff
        run: grep -i complexity pr-metrics.txt || echo "no complexity changes found"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-metrics
          path: pr-metrics.*
      # Forked PRs get a read-only token; never fail the run on the comment.
      - name: pr-comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### PR code metrics'; echo '```'; cat pr-metrics.txt; echo '```'
            echo; echo 'Full HTML report is in the `pr-metrics` run artifact.'; } > body.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file body.md
