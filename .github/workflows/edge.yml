name: edge

# Every merge to main publishes an edge pre-release: the next patch after the
# newest stable tag, numbered by commits since it (v0.5.7 + 3 commits ->
# v0.5.8-edge.3). Stable releases stay with release.yml and a vX.Y.Z tag.
# depstamper publishes: it is the "release tags" ruleset's bypass actor for
# edge tags, and release.yml ignores them (an app's tag push starts workflows).
on:
  push:
    branches: [main]

concurrency:
  group: edge
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    # The app token does the writing; the workflow token only reads.
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APPROVER_APP_ID }}
          private-key: ${{ secrets.APPROVER_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Edge version
        id: v
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*')
          n=$(git rev-list --count "$last"..HEAD)
          IFS=. read -r major minor patch <<<"${last#v}"
          echo "last=$last" >>"$GITHUB_OUTPUT"
          echo "n=$n" >>"$GITHUB_OUTPUT"
          echo "tag=v$major.$minor.$((patch + 1))-edge.$n" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.v.outputs.n != '0'
        with:
          go-version-file: go.mod
      - name: Install aarch64 cross toolchain
        if: steps.v.outputs.n != '0'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Tag
        if: steps.v.outputs.n != '0'
        run: |
          git tag "${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"
      # Notes cover everything since the last stable release, not just since
      # the previous edge build.
      - name: Release notes
        if: steps.v.outputs.n != '0'
        run: scripts/changelog.sh "${{ steps.v.outputs.tag }}" "${{ steps.v.outputs.last }}" >"$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: steps.v.outputs.n != '0'
        with:
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
          distribution: goreleaser
          version: v2.18.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      # Keep the ten newest edge builds; stable releases never match.
      - name: Prune old edge releases
        if: steps.v.outputs.n != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-edge\\.[0-9]+$")))] | .[10:][].tagName' |
            xargs -r -n1 gh release delete -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
